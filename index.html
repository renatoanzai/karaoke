<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#18181B">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>Anzai Karaoke</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #fff;
      color: #18181B;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ─────────────────────────────────── */
    header {
      background: #18181B;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      gap: 12px;
    }
    .logo {
      color: #fff;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.3px;
      white-space: nowrap;
    }
    .header-search {
      flex: 1;
      max-width: 420px;
      display: flex;
      align-items: center;
      gap: 8px;
      background: #27272A;
      border-radius: 8px;
      padding: 8px 12px;
    }
    .header-search-icon { color: #71717A; font-size: 14px; flex-shrink: 0; }
    .header-search input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      font-size: 14px;
      color: #fff;
      min-width: 0;
    }
    .header-search input::placeholder { color: #52525B; }
    .clear-btn {
      background: none;
      border: none;
      color: #52525B;
      cursor: pointer;
      font-size: 14px;
      padding: 0;
      flex-shrink: 0;
      display: none;
      line-height: 1;
    }
    .total-count { color: #52525B; font-size: 12px; white-space: nowrap; flex-shrink: 0; }

    /* ── Layout ─────────────────────────────────── */
    .layout {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── Sidebar ─────────────────────────────────── */
    .sidebar {
      width: 200px;
      background: #F4F4F5;
      border-right: 1px solid #E4E4E7;
      flex-shrink: 0;
      overflow-y: auto;
      padding: 16px 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      font-size: 13px;
      color: #71717A;
      cursor: pointer;
      border-left: 2px solid transparent;
      user-select: none;
    }
    .nav-item.active {
      color: #18181B;
      font-weight: 500;
      border-left-color: #18181B;
      background: #E4E4E7;
    }
    .nav-item:hover:not(.active) { background: #EBEBEC; color: #3F3F46; }
    .nav-icon { font-size: 16px; line-height: 1; }
    .nav-label { flex: 1; }
    .nav-count {
      font-size: 11px;
      color: #A1A1AA;
      background: #E4E4E7;
      border-radius: 10px;
      padding: 1px 7px;
      font-variant-numeric: tabular-nums;
    }
    .nav-item.active .nav-count { background: #D4D4D8; color: #71717A; }

    /* ── Main ─────────────────────────────────────── */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Toolbar ──────────────────────────────────── */
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 14px;
      border-bottom: 1px solid #F0F0F0;
      flex-shrink: 0;
      gap: 8px;
    }
    .result-meta {
      font-size: 11px;
      color: #A1A1AA;
      flex: 1;
    }
    .toolbar-controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .ctrl-btn {
      background: #F4F4F5;
      border: 1px solid #E4E4E7;
      border-radius: 6px;
      padding: 4px 9px;
      font-size: 12px;
      color: #52525B;
      cursor: pointer;
      white-space: nowrap;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      line-height: 1.4;
    }
    .ctrl-btn:active { background: #E4E4E7; }
    .ctrl-sep {
      width: 1px;
      height: 16px;
      background: #E4E4E7;
    }

    /* ── Font size levels ─────────────────────────── */
    body[data-font="sm"] .song-title { font-size: 12px; }
    body[data-font="sm"] .song-artist { font-size: 10px; }
    body[data-font="lg"] .song-title { font-size: 17px; }
    body[data-font="lg"] .song-artist { font-size: 14px; }
    body[data-font="xl"] .song-title { font-size: 20px; }
    body[data-font="xl"] .song-artist { font-size: 16px; }
    body[data-font="xxl"] .song-title { font-size: 24px; }
    body[data-font="xxl"] .song-artist { font-size: 19px; }

    /* ── Song list ────────────────────────────────── */
    .song-list {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .song-row {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 11px 16px;
      border-bottom: 1px solid #F4F4F5;
    }
    .song-row:active { background: #FAFAFA; }
    .song-num {
      font-size: 12px;
      font-weight: 500;
      color: #A1A1AA;
      min-width: 44px;
      flex-shrink: 0;
      font-variant-numeric: tabular-nums;
    }
    .song-info { flex: 1; min-width: 0; }
    .song-title {
      font-size: 14px;
      font-weight: 500;
      color: #18181B;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .song-artist {
      font-size: 12px;
      color: #A1A1AA;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── States ────────────────────────────────────── */
    .state-msg {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      gap: 12px;
      color: #A1A1AA;
      font-size: 14px;
      padding: 60px 32px;
      text-align: center;
      height: 100%;
    }
    .spinner {
      width: 28px;
      height: 28px;
      border: 2.5px solid #E4E4E7;
      border-top-color: #18181B;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Mobile bottom tabs ─────────────────────────── */
    .bottom-tabs {
      display: none;
      background: #18181B;
      border-top: 1px solid #27272A;
      flex-shrink: 0;
    }
    .btab {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 8px 4px 12px;
      font-size: 10px;
      color: #52525B;
      cursor: pointer;
      gap: 4px;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .btab.active { color: #fff; }
    .btab-icon { font-size: 20px; line-height: 1; }

    /* ── Responsive ─────────────────────────────────── */
    @media (max-width: 600px) {
      header { padding: 10px 12px; }
      .logo { font-size: 16px; }
      .total-count { display: none; }
      .header-search { max-width: none; padding: 7px 10px; }
      .header-search input { font-size: 15px; }
      .sidebar { display: none; }
      .bottom-tabs { display: flex; }
      .result-meta { padding: 5px 12px 2px; }
      .song-row { padding: 10px 12px; gap: 12px; }
      .song-title { font-size: 13px; }
      .song-artist { font-size: 11px; }
    }

    @media (hover: hover) {
      .song-row:hover { background: #FAFAFA; }
    }

    /* ── Bottom sheet ────────────────────────────────── */
    .backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      z-index: 100;
    }
    .backdrop.open { display: block; }
    .sheet {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #fff;
      border-radius: 18px 18px 0 0;
      padding: 0 20px 36px;
      z-index: 101;
      max-width: 600px;
      margin: 0 auto;
      transform: translateY(100%);
      transition: transform 0.25s ease;
    }
    .sheet.open { transform: translateY(0); }
    .sheet-handle {
      width: 36px;
      height: 4px;
      background: #E4E4E7;
      border-radius: 2px;
      margin: 12px auto 20px;
    }
    .sheet-number {
      display: inline-block;
      background: #18181B;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      border-radius: 8px;
      padding: 4px 10px;
      margin-bottom: 12px;
      font-variant-numeric: tabular-nums;
    }
    .sheet-title {
      font-size: 20px;
      font-weight: 700;
      color: #18181B;
      line-height: 1.25;
      margin-bottom: 4px;
    }
    .sheet-artist {
      font-size: 14px;
      color: #71717A;
      margin-bottom: 20px;
    }
    .sheet-lyrics-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: #A1A1AA;
      margin-bottom: 8px;
    }
    .sheet-lyrics {
      font-size: 15px;
      color: #3F3F46;
      line-height: 1.7;
      font-style: italic;
    }
  </style>
</head>
<body>

<header>
  <span class="logo">🎤 Anzai Karaoke</span>
  <div class="header-search">
    <span class="header-search-icon">🔍</span>
    <input id="search" type="search" placeholder="Buscar música, artista ou número..." autocomplete="off" autocorrect="off" spellcheck="false">
    <button class="clear-btn" id="clear-btn" aria-label="Limpar">✕</button>
  </div>
  <span class="total-count" id="total-count">Carregando...</span>
</header>

<div class="layout">
  <nav class="sidebar" id="sidebar"></nav>
  <div class="main">
    <div class="toolbar">
      <span class="result-meta" id="result-meta"></span>
      <div class="toolbar-controls">
        <button class="ctrl-btn" id="sort-btn" aria-label="Ordenar">↕ Artista</button>
        <div class="ctrl-sep"></div>
        <button class="ctrl-btn" id="font-down" aria-label="Diminuir fonte">A−</button>
        <button class="ctrl-btn" id="font-up" aria-label="Aumentar fonte">A+</button>
      </div>
    </div>
    <div class="song-list" id="song-list">
      <div class="state-msg">
        <div class="spinner"></div>
        <span>Carregando músicas...</span>
      </div>
    </div>
  </div>
</div>

<nav class="bottom-tabs" id="bottom-tabs"></nav>

<div class="backdrop" id="backdrop"></div>
<div class="sheet" id="sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-number" id="sheet-number"></div>
  <div class="sheet-title" id="sheet-title"></div>
  <div class="sheet-artist" id="sheet-artist"></div>
  <div id="sheet-lyrics-wrap">
    <div class="sheet-lyrics-label">Início da letra</div>
    <div class="sheet-lyrics" id="sheet-lyrics"></div>
  </div>
</div>

<script>
  const SONGS_URL = './songs.json';

  const CATS = [
    { key: 'nacionais',      label: 'Nacionais',     icon: '🎵' },
    { key: 'internacionais', label: 'Internacionais', icon: '✈️' },
    { key: 'japonesas',      label: 'Japonesas',      icon: '🌸' },
  ];

  let allSongs       = [];
  let activeCategory = 'nacionais';
  let query          = '';
  let sortBy         = localStorage.getItem('karaoke_sort') || 'artist';
  const FONT_LEVELS  = ['sm', 'md', 'lg', 'xl', 'xxl'];
  let fontIdx        = FONT_LEVELS.indexOf(localStorage.getItem('karaoke_font') || 'md');

  // ── Load songs ────────────────────────────────────────
  async function loadSongs() {
    const res = await fetch(SONGS_URL);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return res.json();
  }

  // ── Accent-insensitive normalize ──────────────────────
  function norm(s) {
    return s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  }

  // ── HTML escape ───────────────────────────────────────
  function esc(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // ── Nav ───────────────────────────────────────────────
  function renderNav() {
    const counts = Object.fromEntries(
      CATS.map(c => [c.key, allSongs.filter(s => s.category === c.key).length])
    );

    document.getElementById('sidebar').innerHTML = CATS.map(c => `
      <div class="nav-item ${c.key === activeCategory ? 'active' : ''}" data-cat="${c.key}">
        <span class="nav-icon">${c.icon}</span>
        <span class="nav-label">${c.label}</span>
        <span class="nav-count">${counts[c.key].toLocaleString('pt-BR')}</span>
      </div>
    `).join('');

    document.getElementById('bottom-tabs').innerHTML = CATS.map(c => `
      <div class="btab ${c.key === activeCategory ? 'active' : ''}" data-cat="${c.key}">
        <span class="btab-icon">${c.icon}</span>
        <span>${c.label}</span>
      </div>
    `).join('');

    document.querySelectorAll('[data-cat]').forEach(el => {
      el.addEventListener('click', () => switchCategory(el.dataset.cat));
    });
  }

  function switchCategory(cat) {
    activeCategory = cat;
    document.getElementById('search').value = '';
    query = '';
    document.getElementById('clear-btn').style.display = 'none';
    document.getElementById('song-list').scrollTop = 0;
    renderNav();
    renderList();
  }

  // ── List ──────────────────────────────────────────────
  function renderList() {
    let list = allSongs.filter(s => s.category === activeCategory);
    const q = norm(query.trim());
    if (q) {
      list = list.filter(s =>
        norm(s.title).includes(q) ||
        norm(s.artist).includes(q) ||
        s.number.includes(q)
      );
    }

    list = [...list].sort((a, b) =>
      sortBy === 'title'  ? norm(a.title).localeCompare(norm(b.title)) :
      sortBy === 'number' ? Number(a.number) - Number(b.number) :
      norm(a.artist).localeCompare(norm(b.artist)) || norm(a.title).localeCompare(norm(b.title))
    );

    document.getElementById('result-meta').textContent =
      q ? `${list.length.toLocaleString('pt-BR')} resultado${list.length !== 1 ? 's' : ''}` : '';

    const container = document.getElementById('song-list');
    if (list.length === 0) {
      container.innerHTML = `<div class="state-msg"><span>Nenhuma música encontrada.</span></div>`;
      return;
    }

    const songMap = {};
    container.innerHTML = list.map((s, i) => {
      songMap[i] = s;
      return `
        <div class="song-row" data-idx="${i}" style="cursor:pointer">
          <span class="song-num">${esc(s.number)}</span>
          <div class="song-info">
            <div class="song-title">${esc(s.title)}</div>
            <div class="song-artist">${esc(s.artist)}</div>
          </div>
        </div>
      `;
    }).join('');

    container.querySelectorAll('.song-row').forEach(el => {
      el.addEventListener('click', () => openSheet(songMap[el.dataset.idx]));
    });
  }

  // ── Search ────────────────────────────────────────────
  const searchEl  = document.getElementById('search');
  const clearBtn  = document.getElementById('clear-btn');

  searchEl.addEventListener('input', () => {
    query = searchEl.value;
    clearBtn.style.display = query ? 'block' : 'none';
    renderList();
  });

  clearBtn.addEventListener('click', () => {
    searchEl.value = '';
    query = '';
    clearBtn.style.display = 'none';
    renderList();
    searchEl.focus();
  });

  // ── Bottom sheet ──────────────────────────────────────
  const backdrop = document.getElementById('backdrop');
  const sheet    = document.getElementById('sheet');

  function openSheet(song) {
    document.getElementById('sheet-number').textContent = song.number;
    document.getElementById('sheet-title').textContent  = song.title;
    document.getElementById('sheet-artist').textContent = song.artist;
    const lyricsWrap = document.getElementById('sheet-lyrics-wrap');
    if (song.lyrics) {
      document.getElementById('sheet-lyrics').textContent = song.lyrics;
      lyricsWrap.style.display = 'block';
    } else {
      lyricsWrap.style.display = 'none';
    }
    backdrop.classList.add('open');
    sheet.classList.add('open');
  }

  function closeSheet() {
    backdrop.classList.remove('open');
    sheet.classList.remove('open');
  }

  backdrop.addEventListener('click', closeSheet);

  // ── Sort ──────────────────────────────────────────────
  const SORT_CYCLE = ['artist', 'title'];
  const SORT_LABEL = { artist: '↕ Artista', title: '↕ Título' };

  function applySort() {
    document.getElementById('sort-btn').textContent = SORT_LABEL[sortBy];
    localStorage.setItem('karaoke_sort', sortBy);
    renderList();
  }

  document.getElementById('sort-btn').addEventListener('click', () => {
    const idx = SORT_CYCLE.indexOf(sortBy);
    sortBy = SORT_CYCLE[(idx + 1) % SORT_CYCLE.length];
    applySort();
  });

  // ── Font size ─────────────────────────────────────────
  function applyFont() {
    const level = FONT_LEVELS[fontIdx];
    document.body.dataset.font = level;
    localStorage.setItem('karaoke_font', level);
    document.getElementById('font-down').disabled = fontIdx === 0;
    document.getElementById('font-up').disabled   = fontIdx === FONT_LEVELS.length - 1;
  }

  document.getElementById('font-up').addEventListener('click', () => {
    if (fontIdx < FONT_LEVELS.length - 1) { fontIdx++; applyFont(); }
  });
  document.getElementById('font-down').addEventListener('click', () => {
    if (fontIdx > 0) { fontIdx--; applyFont(); }
  });

  // ── Boot ──────────────────────────────────────────────
  (async () => {
    applyFont();
    applySort();
    try {
      allSongs = await loadSongs();
      document.getElementById('total-count').textContent =
        allSongs.length.toLocaleString('pt-BR') + ' músicas';
      renderNav();
      renderList();
    } catch (e) {
      document.getElementById('song-list').innerHTML =
        `<div class="state-msg"><span>Erro ao carregar.<br><small>${e.message}</small></span></div>`;
      document.getElementById('total-count').textContent = '';
    }
  })();
</script>
</body>
</html>
